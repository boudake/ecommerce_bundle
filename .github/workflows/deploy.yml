name: Databricks CI/CD

on:
  pull_request:
    branches: [develop, main]

  push:
    branches: [develop, main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # Python tests
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest -v


  # ============================================================
  # Databricks bundle validation
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    needs: test

    env:
      TARGET: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'prod' || 'dev' }}

      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t $TARGET


  # ============================================================
  # Deploy DEV
  # ============================================================
  deploy-dev:
    if: github.event_name != 'pull_request' && github.ref_name == 'develop'

    needs: validate

    runs-on: ubuntu-latest

    environment: dev

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        run: databricks bundle deploy -t dev

      - name: Run pipeline
        run: databricks bundle run ecommerce_pipeline -t dev


  # ============================================================
  # Deploy PROD
  # ============================================================
  deploy-prod:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'

    needs: validate

    runs-on: ubuntu-latest

    environment: prod

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        run: databricks bundle deploy -t prod