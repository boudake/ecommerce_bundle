resources:
  pipelines:
    ecommerce_pipeline:

      name: ecommerce_pipeline

      catalog: ${var.catalog}
      schema: bronze

      serverless: true

      configuration:
        ecommerce.catalog: ${var.catalog}
        ecommerce.environment: ${var.environment}

        ecommerce.raw_path: "/Volumes/ecommerce/raw/data"

        ecommerce.bronze.schema: bronze
        ecommerce.silver.schema: silver
        ecommerce.gold.schema: gold

      libraries:
        - glob:
            include: ../src/**