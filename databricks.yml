
bundle:
  name: ecommerce_bundle

variables:
  catalog:
    default: dev_bundle
  schema:
    default: dev
  environment:
    default: dev  

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9aed42fa-dfb9.cloud.databricks.com/
    variables:
      catalog: dev_bundle
      environment: dev  
  
  prod:
    mode: production
    workspace:
      host: https://dbc-9aed42fa-dfb9.cloud.databricks.com/

    variables:
      catalog: prod_bundle
      schema: prod
      environment: prod
