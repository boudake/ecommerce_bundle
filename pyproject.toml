[project]
name = "ecommerce-analytics"
version = "0.1.0"

dependencies = [
    "pyspark"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]